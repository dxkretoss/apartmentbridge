<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="abGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#155C93"/>
      <stop offset="100%" stop-color="#218557"/>
    </linearGradient>
    <linearGradient id="archGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#31A46F"/>
      <stop offset="100%" stop-color="#2A82C4"/>
    </linearGradient>
  </defs>
  <!-- Background Rounded Squircle -->
  <rect width="64" height="64" rx="16" fill="#14293D"/>
  
  <!-- Apartment Building Columns -->
  <rect x="14" y="16" width="10" height="34" rx="2" fill="url(#abGrad)"/>
  <rect x="27" y="10" width="10" height="40" rx="2" fill="url(#abGrad)"/>
  <rect x="40" y="20" width="10" height="30" rx="2" fill="url(#abGrad)"/>
  
  <!-- Window Lights -->
  <rect x="17" y="20" width="4" height="4" rx="1" fill="#D6E9F7" fill-opacity="0.85"/>
  <rect x="17" y="28" width="4" height="4" rx="1" fill="#D6E9F7" fill-opacity="0.85"/>
  <rect x="30" y="14" width="4" height="4" rx="1" fill="#D7F0E2" fill-opacity="0.9"/>
  <rect x="30" y="22" width="4" height="4" rx="1" fill="#D7F0E2" fill-opacity="0.9"/>
  <rect x="30" y="30" width="4" height="4" rx="1" fill="#D7F0E2" fill-opacity="0.9"/>
  <rect x="43" y="24" width="4" height="4" rx="1" fill="#D6E9F7" fill-opacity="0.85"/>
  <rect x="43" y="32" width="4" height="4" rx="1" fill="#D6E9F7" fill-opacity="0.85"/>
  
  <!-- Connecting Bridge Arch -->
  <path d="M8 50 C 20 38, 44 38, 56 50" stroke="url(#archGrad)" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Bridge Road Base -->
  <path d="M6 53 L 58 53" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="3" stroke-linecap="round"/>
  <!-- Suspension Lines -->
  <line x1="20" y1="44" x2="20" y2="53" stroke="#31A46F" stroke-width="1.5" stroke-dasharray="1.5 1.5"/>
  <line x1="32" y1="41" x2="32" y2="53" stroke="#2A82C4" stroke-width="1.5" stroke-dasharray="1.5 1.5"/>
  <line x1="44" y1="44" x2="44" y2="53" stroke="#31A46F" stroke-width="1.5" stroke-dasharray="1.5 1.5"/>
</svg>
